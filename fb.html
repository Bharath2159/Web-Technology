<!DOCTYPE html>
<html>
<head>
  <title>Simple Login</title>
</head>
<style>
  h1{
    text-align: end;
    color: blue;
  }
</style>
<body>
    <h1>Facebook</h1>
  <div style="border:1px solid blue; padding:10px; width:250px; margin-left:auto; margin-right:20px; margin-top:20px; background:white;">
    <form>
      <label>Email</label><br>
      <input type="text" style="margin:5px; padding:5px; border:1px solid blue;"><br>
      
      <label>Password</label><br>
      <input type="password" style="margin:5px; padding:5px; border:1px solid blue;"><br>
      
      <button type="submit" style="margin:5px; padding:5px; border:1px solid blue;">Login</button><br>
      
      <a href="#" style="margin:5px; display:inline-block;">Forgot Password?</a><br>
      
      <button type="button" style="margin:5px; padding:5px; border:1px solid blue;">Create Account</button>
    </form>
  </div>

</body>
</html>
